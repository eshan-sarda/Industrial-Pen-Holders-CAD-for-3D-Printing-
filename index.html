<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open CAD Vault - Eshan Sarda</title>
    <!-- Import Google's Model Viewer script -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        model-viewer { width: 100%; height: 65vh; background: #1e293b; border-radius: 12px; margin: 20px 0; }
        select { background: #1e293b; color: white; padding: 12px 18px; border-radius: 8px; border: 1px solid #475569; font-size: 16px; margin-bottom: 10px; cursor: pointer; width: 100%; max-width: 400px; }
        .btn { background: #2563eb; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold; display: inline-block; margin-top: 10px; }
        .btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mechanical Component Vault</h1>
        <p>Select a design from the list below to inspect it live in 3D or grab the raw source files.</p>

        <!-- Model Selector Dropdown -->
        <select id="modelSelect" onchange="changeModel()">
            <option value="Submerged Arc Furnace Pen Holder.glb">Submerged Arc Furnace Pen Holder</option>
            <option value="General Purpose Gearbox Type Pen Holder.glb">General Purpose Gearbox Type Pen Holder</option>
            <option value="Ceramic Filter Type Pen Holder.glb">Ceramic Filter Type Pen Holder</option>
            <option value="Wire Rod Pen Holder.glb">Wire Rod Pen Holder</option>
            <option value="Power Plant Cup Holder.glb">Power Plant Cup Holder</option>
            <option value="Presentation Cup Pen Holder.glb">Presentation Cup Pen Holder</option>
            <option value="Induction Furnace Based Cup Holder_.glb">Induction Furnace Based Cup Holder</option>
        </select>

        <!-- The 3D Interactive Viewer -->
        <model-viewer id="viewer" src="Submerged Arc Furnace Pen Holder.glb" alt="CAD Model" auto-rotate camera-controls shadow-intensity="1">
        </model-viewer>

        <!-- Direct Download Link for your raw CAD files -->
        <br>
        <a class="btn" href="downloads/source-files.zip" download>Download All Raw CAD Files (.ZIP)</a>
    </div>

    <script>
        function changeModel() {
            const select = document.getElementById('modelSelect');
            const viewer = document.getElementById('viewer');
            viewer.src = select.value;
        }
    </script>

</body>
</html>
