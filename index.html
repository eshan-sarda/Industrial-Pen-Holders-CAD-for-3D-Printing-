<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial Design Pen Holders - Eshan Sarda</title>
    <!-- Import Google's Model Viewer script -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        :root {
            --bg-color: #050b14;
            --card-bg: rgba(15, 23, 42, 0.45);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .main-wrapper {
            max-width: 850px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            position: relative;
            padding-bottom: 70px;
        }

        .content-area {
            display: flex;
            flex-direction: column;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtext {
            font-size: 14px;
            color: var(--text-sub);
            margin-top: 4px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p.instructions {
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 15px;
        }

        select {
            background: rgba(30, 41, 59, 0.6);
            color: var(--text-main);
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            font-size: 15px;
            margin-bottom: 20px;
            cursor: pointer;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }

        select:hover, select:focus {
            border-color: var(--accent);
        }

        model-viewer {
            width: 100%;
            height: 50vh;
            background: rgba(5, 11, 20, 0.5);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--accent);
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
            flex: 1;
            min-width: 180px;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .footer-credit {
            position: absolute;
            bottom: 20px;
            left: 32px;
            font-size: 12px;
            color: var(--text-sub);
            line-height: 1.4;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="content-area">
            <header>
                <h1>Industrial Design Pen Holders</h1>
                <div class="subtext">Originally made for SEML</div>
            </header>

            <p class="instructions">Select a model from the menu below to inspect it live in 3D, or download the raw STL and GLB files separately.</p>

            <!-- Model Selector Dropdown -->
            <select id="modelSelect" onchange="updateView()">
                <option value="Submerged Arc Furnace Pen Holder" data-glb="Submerged Arc Furnace Pen Holder.glb" data-stl="stls/Submerged Arc Furnace Pen Holder.stl">Submerged Arc Furnace Pen Holder</option>
                <option value="General Purpose Gearbox Type Pen Holder" data-glb="General Purpose Gearbox Type Pen Holder.glb" data-stl="stls/General Purpose Gearbox Type Pen Holder.stl">General Purpose Gearbox Type Pen Holder</option>
                <option value="Ceramic Filter Type Pen Holder" data-glb="Ceramic Filter Type Pen Holder.glb" data-stl="stls/Ceramic Filter Type Pen Holder.stl">Ceramic Filter Type Pen Holder</option>
                <option value="Wire Rod Pen Holder" data-glb="Wire Rod Pen Holder.glb" data-stl="stls/Wire Rod Pen Holder.stl">Wire Rod Pen Holder</option>
                <option value="Power Plant Cup Holder" data-glb="Power Plant Cup Holder.glb" data-stl="stls/Power Plant Cup Holder.stl">Power Plant Cup Holder</option>
                <option value="Presentation Cup Pen Holder" data-glb="Presentation Cup Pen Holder.glb" data-stl="stls/Presentation Cup Pen Holder.stl">Presentation Cup Pen Holder</option>
                <option value="Induction Furnace Based Cup Holder_" data-glb="Induction Furnace Based Cup Holder_.glb" data-stl="stls/Induction Furnace Based Cup Holder_.stl">Induction Furnace Based Cup Holder</option>
            </select>

            <!-- The 3D Interactive Viewer -->
            <model-viewer id="viewer" src="Submerged Arc Furnace Pen Holder.glb" alt="CAD Model" auto-rotate camera-controls shadow-intensity="1">
            </model-viewer>

            <!-- Dual Download Buttons (Both Light Blue) -->
            <div class="button-group">
                <a id="downloadStlBtn" class="btn" href="stls/Submerged Arc Furnace Pen Holder.stl" download>Download STL</a>
                <a id="downloadGlbBtn" class="btn" href="Submerged Arc Furnace Pen Holder.glb" download>Download GLB</a>
            </div>
        </div>

        <div class="footer-credit">
            Made by Eshan Sarda, Originally for Sarda Energy and Minerals Summer Internship 2026.
        </div>
    </div>

    <script>
        function updateView() {
            const select = document.getElementById('modelSelect');
            const viewer = document.getElementById('viewer');
            const downloadStlBtn = document.getElementById('downloadStlBtn');
            const downloadGlbBtn = document.getElementById('downloadGlbBtn');
            
            const selectedOption = select.options[select.selectedIndex];
            
            const glbFile = selectedOption.getAttribute('data-glb');
            const stlFile = selectedOption.getAttribute('data-stl');
            
            viewer.src = glbFile;
            
            downloadStlBtn.href = stlFile;
            downloadGlbBtn.href = glbFile;
        }
    </script>

</body>
</html>
