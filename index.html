<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open CAD Vault - Eshan Sarda</title>
    <!-- Import Google's Model Viewer script -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        model-viewer { width: 100%; height: 65vh; background: #1e293b; border-radius: 12px; margin: 20px 0; }
        select { background: #1e293b; color: white; padding: 12px 18px; border-radius: 8px; border: 1px solid #475569; font-size: 16px; margin-bottom: 10px; cursor: pointer; width: 100%; max-width: 400px; }
        .btn { background: #2563eb; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold; display: inline-block; margin-top: 10px; }
        .btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mechanical Component Vault</h1>
        <p>Select a design from the list below to inspect it live in 3D or download its raw STL file.</p>

        <!-- Model Selector Dropdown -->
        <select id="modelSelect" onchange="updateView()">
            <option value="Submerged Arc Furnace Pen Holder" data-glb="Submerged Arc Furnace Pen Holder.glb" data-stl="Submerged Arc Furnace Pen Holder.stl">Submerged Arc Furnace Pen Holder</option>
            <option value="General Purpose Gearbox Type Pen Holder" data-glb="General Purpose Gearbox Type Pen Holder.glb" data-stl="General Purpose Gearbox Type Pen Holder.stl">General Purpose Gearbox Type Pen Holder</option>
            <option value="Ceramic Filter Type Pen Holder" data-glb="Ceramic Filter Type Pen Holder.glb" data-stl="Ceramic Filter Type Pen Holder.stl">Ceramic Filter Type Pen Holder</option>
            <option value="Wire Rod Pen Holder" data-glb="Wire Rod Pen Holder.glb" data-stl="Wire Rod Pen Holder.stl">Wire Rod Pen Holder</option>
            <option value="Power Plant Cup Holder" data-glb="Power Plant Cup Holder.glb" data-stl="Power Plant Cup Holder.stl">Power Plant Cup Holder</option>
            <option value="Presentation Cup Pen Holder" data-glb="Presentation Cup Pen Holder.glb" data-stl="Presentation Cup Pen Holder.stl">Presentation Cup Pen Holder</option>
            <option value="Induction Furnace Based Cup Holder_" data-glb="Induction Furnace Based Cup Holder_.glb" data-stl="Induction Furnace Based Cup Holder_.stl">Induction Furnace Based Cup Holder</option>
        </select>

        <!-- The 3D Interactive Viewer -->
        <model-viewer id="viewer" src="Submerged Arc Furnace Pen Holder.glb" alt="CAD Model" auto-rotate camera-controls shadow-intensity="1">
        </model-viewer>

        <!-- Dynamic STL Download Link -->
        <br>
        <a id="downloadBtn" class="btn" href="stls/Submerged Arc Furnace Pen Holder.stl" download>Download Raw STL File</a>
    </div>

    <script>
        function updateView() {
            const select = document.getElementById('modelSelect');
            const viewer = document.getElementById('viewer');
            const downloadBtn = document.getElementById('downloadBtn');
            
            const selectedOption = select.options[select.selectedIndex];
            
            // Update 3D viewer source
            viewer.src = selectedOption.getAttribute('data-glb');
            
            // Update download button link and filename
            const stlFile = selectedOption.getAttribute('data-stl');
            downloadBtn.href = "stls/" + stlFile;
        }
    </script>

</body>
</html>
